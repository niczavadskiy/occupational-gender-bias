# Contrastive steering: gender mean-diff direction, Qwen3.5-4B-Base.
#
# Пояс не копировать с 2B: gender_choice на 4B плато L20–26, INLP жил на L23.

version: v1
hypothesis: contrastive
scale: 4b
created: 2026-09-19

source:
  model_id: Qwen/Qwen3.5-4B-Base
  d_model: 2560
  n_hidden_states: 33
  hidden_state_index: "0 = embeddings, 1..32 = block output"
  sample: samples/h1_stagea_sample_v1.json
  label: live_choice
  label_note: >-
    y=1 iff argmax constrained P(y|x) на live forward попал в слот "man".
  split:
    train_frac: 0.7
    seed: 0
    note: >-
      v и c считаются только на train-семьях captured sample.
      Stage A гоняется на всём sample (как INLP live).

hook:
  site: residual_stream_hidden_state
  positions: last_prompt_token
  note: >-
    Интервенция там же, где снимается HS (last token после "Answer:").

vectors:
  - id: v_mean_diff
    short: vmd
    role: candidate
    kind: mean_diff
    description: >-
      Unit mean-diff: mean(h|man) − mean(h|woman) на train-семьях.
      Классы взвешены поровну.

  - id: v_random
    short: vrand
    role: control
    kind: random_unit
    seeds: [0, 1, 2]
    description: Null-контроль — случайное unit-направление (3 seed).

interventions:
  - id: center
    formula: "h' = h − α·(s − c)·ŵ"
    reference_c: class_midpoint_train
    reference_note: >-
      c = mid-point mean(s|man) и mean(s|woman) только на train.
    alphas: [0.25, 0.5, 0.75, 1.0]

  - id: project_out
    formula: "h' = h − s·ŵ"
    reference_c: origin
    alphas: [1.0]

  - id: shift
    formula: "h' = h + β·σ_train·ŵ"
    scale: train_projection_std
    betas: [-1.0, -0.5, 0.5, 1.0]

layers:
  belt: [20, 21, 22, 23, 24, 25, 26]
  core: [22, 23, 24, 25]
  edge: [20, 21, 26]
  anchor: 23
  note: >-
    Пояс H1/INLP на 4B. Anchor L23 — слой, где gender-INLP дал эффект
    (probe peak L24 был null на Stage A).

families:
  - id: main_center_core
    enabled: true
    role: candidate
    vectors: [v_mean_diff]
    layers: core
    intervention: center
    alphas: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0]
    description: "Ядро пояса, полная шкала α. 1 × 4 × 6 = 24."

  - id: main_center_edge
    enabled: true
    role: candidate
    vectors: [v_mean_diff]
    layers: edge
    intervention: center
    alphas: [0.5, 1.0]
    description: "Края пояса. 1 × 3 × 2 = 6."

  - id: main_project_out
    enabled: true
    role: candidate
    vectors: [v_mean_diff]
    layers: belt
    intervention: project_out
    description: "Удаление оси на каждом слое пояса. 7."

  - id: causality_shift
    enabled: true
    role: control
    vectors: [v_mean_diff]
    layers: [23]
    intervention: shift
    description: "Знаковый sanity на L23. 4."

  - id: anti_steering
    enabled: true
    role: control
    vectors: [v_mean_diff]
    layers: [23]
    intervention: center
    alphas: [-0.5, -1.0]
    description: "Усиление |s−c| на L23. 2."

  - id: control_random
    enabled: true
    role: control
    vectors: [v_random]
    layers: [23]
    intervention: project_out
    description: "Null: 3 random seeds. 3."

baseline:
  id: baseline
  description: Без интервенции на той же выборке.

screening:
  stage: A
  sample:
    source_split: val
    n_base_items: 95
    fraction_of_all_groups: 0.10
    stratify_by: soc_major_title
    rows_per_item: 4
    seed: 20260809
  forwards_per_candidate: 380
  primary_metric:
    id: mean_abs_theta_dev
    formula: "mean_i |θ_i − 0.5|, θ_i = M_i/(M_i+W_i) по base item"
    direction: minimize
  secondary_metrics:
    - id: abs_theta_bar_dev
      formula: "|θ̄ − 0.5|"
    - id: reduction_vs_baseline
      formula: "mean_abs_theta_dev(baseline) − mean_abs_theta_dev(candidate)"
  guardrails:
    mode: flag
    slot_choice_rate_shift_pp_max: 10
    narrative_choice_rate_shift_pp_max: 10
  keep_top: 10
  keep_rule: >-
    Топ по primary_metric среди role=candidate. random ≈ baseline;
    shift ±β расходятся по знаку; anti_steering увеличивает mean_abs_theta_dev.
