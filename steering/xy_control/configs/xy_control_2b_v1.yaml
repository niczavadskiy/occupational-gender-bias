# Gender-conditioned activation steering via XY-control, Qwen3.5-2B-Base.
#
# v_raw = mean_i (h_gender[i] − h_XY[i]) on train families, then unit-norm.
# Intervention: add  h' = h − α v̂  at last prompt token.
#
#   python -m steering.xy_control.build_dataset
#   python -m steering.xy_control.build_candidates
#   python -m steering.xy_control.build_vectors --device cuda
#   python -m steering.xy_control.run_stagea --device cuda --tag xy_2b_a_v1

version: v1
hypothesis: xy_control
scale: 2b
created: 2026-09-19

source:
  model_id: Qwen/Qwen3.5-2B-Base
  d_model: 2048
  n_hidden_states: 25
  hidden_state_index: "0 = embeddings, 1..24 = block output"
  mapping: {X: man, "Y": woman}
  fit_sample: data/xy_pairs_full_v1.json
  eval_sample: data/xy_pairs_full_v1.json
  label: paired_xy_control
  label_note: >-
    d_i = last-token HS(gendered prompt) − last-token HS(XY prompt) for the
    same row. v_raw is the mean of d_i on train families. Not a gender
    direction — a gender-conditioned activation direction.
  split:
    train_frac: 0.70
    val_frac: 0.15
    test_frac: 0.15
    seed: 0
    stratify_by: soc_major_title
    note: >-
      70/15/15 inside each soc_major_title (not a global shuffle).
      train (~667): fit v_raw, then h' = h − αv̂. val (~142): Stage A
      GenderGap after steering. test (~142): locked until α/layer chosen.
      XY prompts are not scored.

hook:
  site: residual_stream_hidden_state
  positions: last_prompt_token
  note: >-
    Capture and intervention are the same site: last token after "Answer:".
    Do not touch embeddings, logits, KV cache, or attention weights.

vectors:
  - id: v_raw
    short: vraw
    role: candidate
    kind: paired_mean_diff
    description: >-
      Unit mean of paired differences d_i = h_gender − h_XY on train families.

  - id: v_random
    short: vrand
    role: control
    kind: random_unit
    seeds: [0, 1, 2]
    description: Null-контроль — случайное unit-направление (3 seed).

interventions:
  - id: add
    formula: "h' = h − α·v̂"
    reference_c: none
    reference_note: >-
      Additive shift along the unit gender-conditioned direction.
      α>0 is the hypothesized debiasing direction (h − αv).
      α<0 tests the opposite sign. α=0 is baseline.
    alphas: [-2.0, -1.0, -0.5, -0.25, 0.25, 0.5, 1.0, 2.0]

layers:
  belt: [14, 15, 16, 17, 18, 19, 20]
  core: [15, 16, 17, 18]
  edge: [14, 19, 20]
  anchor: 16
  note: >-
    Тот же пояс, что H1/contrastive на 2B (скачок gender_choice на L15–16).

families:
  - id: main_add_core
    enabled: true
    role: candidate
    vectors: [v_raw]
    layers: core
    intervention: add
    alphas: [-2.0, -1.0, -0.5, -0.25, 0.25, 0.5, 1.0, 2.0]
    description: "Ядро пояса, полная шкала α включая оба знака. 4 × 8 = 32."

  - id: main_add_edge
    enabled: true
    role: candidate
    vectors: [v_raw]
    layers: edge
    intervention: add
    alphas: [-1.0, -0.5, 0.5, 1.0]
    description: "Края пояса, прореженная шкала. 3 × 4 = 12."

  - id: control_random
    enabled: true
    role: control
    vectors: [v_random]
    layers: [16]
    intervention: add
    alphas: [1.0]
    description: "Null: 3 random seeds на якоре, α=1. 3."

baseline:
  id: baseline
  description: Без интервенции на той же выборке (α=0).

screening:
  stage: A
  sample:
    source_split: all
    n_base_items: 951
    n_eval_families: 142
    fraction_of_all_groups: 1.0
    stratify_by: soc_major_title
    rows_per_item: 4
    seed: 0
  forwards_per_candidate: 568
  primary_metric:
    id: gender_gap
    formula: "mean_i Δ_i, Δ_i = mean_layouts (log P(man) − log P(woman))"
    direction: reduce_abs
  secondary_metrics:
    - id: mean_abs_delta
      formula: "mean_i |Δ_i| after layout average"
    - id: p_delta_positive
      formula: "P(Δ_i > 0)"
    - id: slot_gap
      formula: "mean_i mean_layouts (z_A − z_B)  # guardrail"
  guardrails:
    mode: flag
    slot_choice_rate_shift_pp_max: 10
  keep_top: 10
  keep_rule: >-
    Среди role=candidate: наибольшее |gender_gap| reduction при
    неотрицательном (или меньшем) slot-gap сдвиге. random ≈ baseline.
    Оба знака α должны развести GenderGap в разные стороны, если направление
    каузально.
