# Sequential pre-peak erase — slot_prob (2B)
#
# Target: continuous p_A (slot_prob), not hard slot_choice.
# Peak slot ≈ L23 on 2B. Prefer real layer_scan val_r2 when available.

version: v1
axis: slot
target: slot_prob
primary_metric: R_slot

model: Qwen/Qwen3.5-2B-Base

layer_scan:
  path: null
  metric: auto

# Stub curve into L23 — replace via --layer-scan / real path.
auc_curve:
  12: 0.35
  13: 0.45
  14: 0.55
  15: 0.62
  16: 0.70
  17: 0.76
  18: 0.82
  19: 0.86
  20: 0.90
  21: 0.93
  22: 0.95
  23: 0.97
  24: 0.96

ascent_pool:
  tau: 0.38
  gamma: 0.25
  chance: 0.0
  min_prev_auc_for_knee: 0.05
  max_pool: 8

ranks: [4, 8, 16]
alphas: [1.0]
synergy_min: 0.005
k_max_fit: 32
ridge_alpha: 1.0
chance_corr: 0.15
clf_C: 0.03

sample: steering/samples/h1_stagea_sample_v1.json
