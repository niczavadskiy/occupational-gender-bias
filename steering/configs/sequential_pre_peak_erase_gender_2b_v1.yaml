# Sequential pre-peak erase — gender_prob (2B)
#
# Target: continuous p_man (gender_prob), not hard gender_choice.
# Ascent pool from layer_scan val_r2 when available; else auc_curve stub.

version: v1
axis: gender
target: gender_prob
primary_metric: R_gender

model: Qwen/Qwen3.5-2B-Base

layer_scan:
  # Prefer v1_rep_prob gender_prob scan if present:
  # results/.../probes/v1_rep_prob/.../gender_prob/layer_scan/results.json
  path: null
  metric: auto   # val_r2 for regression scans

# Stub ascent (R²-like / relative) into L16 — replace with real gender_prob layer_scan.
auc_curve:
  10: 0.15
  11: 0.22
  12: 0.28
  13: 0.40
  14: 0.55
  15: 0.70
  16: 0.82
  17: 0.80
  18: 0.78

ascent_pool:
  tau: 0.38
  gamma: 0.25
  chance: 0.0
  min_prev_auc_for_knee: 0.05
  max_pool: 8

ranks: [4, 8, 16]
alphas: [1.0]
synergy_min: 0.005
k_max_fit: 32
ridge_alpha: 1.0
chance_corr: 0.15
clf_C: 0.03

sample: steering/samples/h1_stagea_sample_v1.json
