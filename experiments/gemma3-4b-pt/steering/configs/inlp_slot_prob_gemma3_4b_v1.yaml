# Classical slot_prob INLP · google/gemma-3-4b-pt
# Belt = slot_choice probe peak + two layers below.

version: v1_peak_prepeak
hypothesis: inlp_slot_prob
scale: gemma3_4b
created: 2026-09-28
status: READY
target: slot_prob

source:
  model_id: google/gemma-3-4b-pt
  d_model: 2560
  n_hidden_states: 35
  hidden_state_index: "0 = embeddings, 1..34 = block output"
  label_note: >-
    Classical INLP on slot last-token HS (slot_prob / p_A). Peak from
    slot_choice classification probe (slot_choice L31).

hook:
  site: residual_stream_hidden_state
  positions: last_prompt_token
  intervention: "h' = h − α W_k (W_kᵀ h − c)"

probe:
  ridge_alpha: 1.0

inlp:
  k_max: 32
  chance:
    corr_threshold: 0.15

layers:
  peak: 31
  prepeak: [30, 29]
  belt: [31, 30, 29]
  core: [31, 30, 29]
  anchor: 31

steering:
  kind: center
  ranks: [1, 4, 8, 16]
  alphas: [1.0]
  random_control: true
  random_seeds: [0]

split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 0
  stratify_by: soc_major_title

families:
  - id: main_center_peak_prepeak
    enabled: true
    role: candidate
    layers: [31, 30, 29]
    ranks: [1, 4, 8, 16]
    alphas: [1.0]
    description: slot peak + peak−1 + peak−2 × ranks; Stage A clamps to k_found.
