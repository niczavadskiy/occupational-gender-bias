# H1 steering: сетка кандидатов (layer × α) для выравнивания gender preference.
#
# Цель: P(man) ≈ P(woman) в каждом домене профессии
# (θ_i = M_i/(M_i+W_i) → 0.5 на base item). Bias по доменам разнонаправлен,
# поэтому базовое семейство гасит проекцию к нейтрали, а не константный сдвиг.
#
# Кандидаты:
#   cd occupational-gender-bias
#   python -m steering.build_h1_candidates \
#     --config experiments/qwen35-4b-base/steering/configs/h1_steering_candidates_v1.yaml \
#     --results-root experiments/qwen35-4b-base/results/qwen35_4b_h1h3_pack \
#     --out-dir experiments/qwen35-4b-base/steering/candidates
# (модуль `steering` — из `repo/`; PYTHONPATH=repo или запуск из repo с абсолютными путями)

version: v1
hypothesis: h1
created: 2026-09-13
model_scale: qwen35_4b

source:
  run: run_2026-09-12_20-25-31_Qwen3.5-4B-Base_v1_full_pos_shuffle
  results_root_hint: experiments/qwen35-4b-base/results/qwen35_4b_h1h3_pack
  probe_root: probes/v1_rep_prob
  model_id: Qwen/Qwen3.5-4B-Base
  d_model: 2560
  n_hidden_states: 33
  # Индекс HS: 0 = embeddings, 1..32 = выход блока L.
  hidden_state_index: "0 = embeddings, 1..32 = block output"
  slugs:
    gender: without_abstain_p0_p1_mf_wf_gender_choice
    narrative: without_abstain_p0_p1_mf_wf_narrative_choice
    slot: without_abstain_p0_p1_mf_wf_slot_choice
  weights_npz: "compare_directions/compare_directions_{target}_weights.npz"
  weights_key: w_raw
  layer_scan: "layer_scan/results.json"
  split:
    file: "probes/_shared/group_split_v1_scenario.json"
    families: {train: 571, val: 190, test: 190}
    note: >-
      Направления обучены на train. Stage A/B — только val, Stage C — test.

hook:
  site: residual_stream_hidden_state
  positions: last_prompt_token
  note: >-
    Интервенция там же, где снимался HS (last token после "Answer:").

# ─────────────────────────────────────────────────────────────────────────────
# Направления
# ─────────────────────────────────────────────────────────────────────────────
vectors:
  - id: w_gender_perp
    short: wgperp
    role: candidate
    kind: probe_direction_orthogonalized
    base: gender
    orthogonalize_against: [narrative, slot]
    description: >-
      Основной кандидат: gender ⊥ {narrative, slot} на том же слое.
      На 4B test bacc gender_choice ~86.6% (L24); после ortho — проверить
      в compare_directions перед Stage A.

  - id: w_gender
    short: wg
    role: candidate
    kind: probe_direction
    base: gender
    description: Сырое направление LogReg gender_choice (аблация к w_gender_perp).

  - id: w_narrative
    short: wnarr
    role: control
    kind: probe_direction
    base: narrative
    description: "Контроль: гасим не ту ось — preference меняться не должно."

  - id: w_slot
    short: wslot
    role: control
    kind: probe_direction
    base: slot
    description: "Контроль: ось выбора слота A/B (пик на 4B ≈ L30)."

  - id: w_random
    short: wrand
    role: control
    kind: random_unit
    seeds: [0, 1, 2]
    description: Null-контроль — случайное unit-направление (3 seed).

interventions:
  - id: center
    formula: "h' = h − α·(s − c)·ŵ"
    reference_c: class_midpoint_train
    reference_note: >-
      c = mid-point mean(s|man) и mean(s|woman) только на train пробы.
      α>0 тянет к нейтрали; α=1 сажает s на c; α>1 зеркалит за c;
      α<0 усиливает |s−c| (anti-steering).
    alphas: [0.25, 0.5, 0.75, 1.0]

  - id: project_out
    formula: "h' = h − s·ŵ"
    reference_c: origin
    reference_note: >-
      Полное удаление компоненты вдоль оси (center с c=0, α=1).
    alphas: [1.0]

  - id: shift
    formula: "h' = h + β·σ_train·ŵ"
    scale: train_projection_std
    reference_note: >-
      Константный сдвиг — контроль каузальности, не equalize.
      ±β обязаны разводить P(man) в разные стороны.
    betas: [-1.0, -0.5, 0.5, 1.0]

# ─────────────────────────────────────────────────────────────────────────────
# Слои — 4B gender_choice layer_scan (2026-09-13)
# val_bacc: L18 .822 | L20 .863 | L22 .867 | L23 .874 | L24 .875 (peak)
#   L25 .871 | L26 .864 | …
# Плато L20–L26; mid 2B (L14–18) на 4B ещё слаб (L16 ~.75).
# НЕ копировать пояс L14–20 с 2B.
# ─────────────────────────────────────────────────────────────────────────────
layers:
  belt: [20, 21, 22, 23, 24, 25, 26]
  core: [22, 23, 24, 25]
  edge: [20, 21, 26]
  anchor: 24
  note: >-
    Пояс L20–L26 вокруг пика L24. Edge = края плато (дешевле α-сетка).
    Ранние / post-26 — только если пояс не даст эффекта (новая версия конфига).

families:
  - id: main_center_core
    enabled: true
    role: candidate
    vectors: [w_gender_perp, w_gender]
    layers: core
    intervention: center
    alphas: [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0]
    description: >-
      Ядро пояса: полная шкала α включая overshoot (>1).
      2 × 4 × 7 = 56.

  - id: main_center_edge
    enabled: true
    role: candidate
    vectors: [w_gender_perp, w_gender]
    layers: edge
    intervention: center
    alphas: [0.25, 0.5, 0.75, 1.0]
    description: "Края пояса: базовая шкала α. 2 × 3 × 4 = 24."

  - id: main_project_out
    enabled: true
    role: candidate
    vectors: [w_gender_perp, w_gender]
    layers: belt
    intervention: project_out
    description: "Полное удаление оси на каждом слое пояса. 2 × 7 = 14."

  - id: causality_shift
    enabled: true
    role: control
    vectors: [w_gender_perp]
    layers: [24]
    intervention: shift
    description: "Знаковый sanity на L24: ±β разводят P(man). 4."

  - id: anti_steering
    enabled: true
    role: control
    vectors: [w_gender_perp]
    layers: [24]
    intervention: center
    alphas: [-0.5, -1.0]
    description: >-
      Усиление |s−c|: preference по доменам должно уйти дальше от 0.5. 2.

  - id: control_other_axes
    enabled: true
    role: control
    vectors: [w_narrative, w_slot]
    layers: [24]
    intervention: project_out
    description: "Специфичность: чужая ось не выравнивает preference. 2."

  - id: control_random
    enabled: true
    role: control
    vectors: [w_random]
    layers: [24]
    intervention: project_out
    description: "Null: 3 random seeds. 3."

  - id: multilayer_band
    enabled: false
    role: candidate
    vectors: [w_gender_perp]
    layers: [23, 24, 25]
    intervention: center
    alphas: [0.5, 1.0]
    apply_to_all_layers_at_once: true
    description: >-
      Одновременная интервенция на трёх слоях вокруг пика. Off до однослойного
      скрининга.

baseline:
  id: baseline
  description: >-
    Без интервенции на той же выборке. Не кандидат: θ̄_before и capability baseline.

screening:
  stage: A
  sample:
    source_split: val
    n_base_items: 95
    fraction_of_all_groups: 0.10
    stratify_by: soc_major_title
    rows_per_item: 4
    seed: 20260809
    note: >-
      95 из 190 val-семей ≈ 10% всех 951. Тот же seed, что 2B — сопоставимость
      семей между масштабами при общем split seed 0. Вторая половина val — Stage B.
  forwards_per_candidate: 380

  primary_metric:
    id: mean_abs_theta_dev
    formula: "mean_i |θ_i − 0.5|, θ_i = M_i/(M_i+W_i) по base item"
    direction: minimize

  secondary_metrics:
    - id: abs_theta_bar_dev
      formula: "|θ̄ − 0.5|"
    - id: reduction_vs_baseline
      formula: "mean_abs_theta_dev(baseline) − mean_abs_theta_dev(candidate)"

  guardrails:
    mode: flag
    slot_choice_rate_shift_pp_max: 10
    narrative_choice_rate_shift_pp_max: 10
    note: Stage A только flag. Дисквалификация — на Stage B.

  keep_top: 15
  keep_rule: >-
    Топ по primary_metric среди role=candidate. Контроли не ранжируются, но
    обязаны: random ≈ baseline; shift ±β расходятся по знаку;
    anti_steering увеличивает mean_abs_theta_dev. Иначе сетка не годится.
