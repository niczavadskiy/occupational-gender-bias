# Classical peak INLP — gender_prob (4B)
# Live Phase A layers = choice peak belt [23,24,25].

version: v1
hypothesis: inlp_gender_prob_4b
target: gender_prob
model: Qwen/Qwen3.5-4B-Base

layers:
  candidates: [23, 24, 25]
  peak: 24

probe:
  ridge_alpha: 1.0

inlp:
  k_max: 32
  chance:
    corr_threshold: 0.15

steering:
  kind: center
  ranks: [4, 8, 16]
  alphas: [1.0]

behavior:
  sample: samples/h1_stagea_sample_v1.json
  primary_axis: gender
