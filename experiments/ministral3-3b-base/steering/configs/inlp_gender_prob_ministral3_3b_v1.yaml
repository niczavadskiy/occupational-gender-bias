# Classical gender_prob INLP · mistralai/Ministral-3-3B-Base-2512
# Belt = gender_choice probe peak + two layers below.

version: v1_peak_prepeak
hypothesis: inlp_gender_prob
scale: ministral3_3b
created: 2026-09-30
status: READY
dtype: bfloat16

source:
  model_id: mistralai/Ministral-3-3B-Base-2512
  d_model: 3072
  n_layers: 26
  n_hidden_states: 27
  hidden_state_index: "0 = embeddings, 1..26 = block output"
  label_note: >-
    Classical INLP on gendered last-token HS (gender_prob). Peak from
    gender_choice L23 (steering PEAK = choice).

hook:
  site: residual_stream_hidden_state
  positions: last_prompt_token
  intervention: "h' = h − α W_k (W_kᵀ h − c)"

target: gender_prob

probe:
  ridge_alpha: 1.0

inlp:
  k_max: 32
  chance:
    corr_threshold: 0.15

layers:
  peak: 23
  prepeak: [22, 21]
  belt: [23, 22, 21]
  core: [23, 22, 21]
  anchor: 23
  note: gender_choice peak L23; soft gender_prob peak was L21 (not used).

steering:
  kind: center
  ranks: [1, 4, 8, 16]
  alphas: [1.0]
  random_control: true
  random_seeds: [0]

split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 0
  stratify_by: soc_major_title

families:
  - id: main_center_peak_prepeak
    enabled: true
    role: candidate
    layers: [23, 22, 21]
    ranks: [1, 4, 8, 16]
    alphas: [1.0]
    description: peak + peak−1 + peak−2 × ranks; Stage A clamps to k_found.
